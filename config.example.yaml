# ════════════════════════════════════════════════════════════════════
# proto-vuln-hunt (python) 配置示例
# 用法:python -m proto_vuln_hunt --config config.example.yaml --target /path/to/repo
# ════════════════════════════════════════════════════════════════════

# ── 后端:用哪个 CLI 来跑每一个 agent ──
# 可选内置:claude | opencode | codex(也可在下方 backends: 里自定义/覆盖调用方式)
backend: claude

# ── 模型:按阶段(role)分别指定;不再支持 models.default 回落 ──
# 当前会运行的 role 必须显式配置。常用 role:recon / history / recheck / decompose / audit / verify / report / poc
# 每个 role 可写单个模型,也可写模型列表;列表会按 agent 调用轮换使用。
# 注意:
#   · claude   模型名形如  claude-opus-4-8 / claude-sonnet-4-6 / claude-haiku-4-5-20251001
#   · opencode 模型名形如  provider/model,如 anthropic/claude-sonnet-4-6、openai/gpt-5
#   · codex    模型名形如  gpt-5-codex / o3 等
models:
  recon: claude-opus-4-8        # 侦察/威胁建模用更强的模型
  history: claude-sonnet-4-6    # git 历史问题模式挖掘(每条提交一个 agent;与 high audit finder 同级调度)
  recheck: claude-sonnet-4-6    # 专用优先排查 agent(历史变体 + 风险点复查;最高优先级、默认并发 1)
  decompose: claude-sonnet-4-6  # region 拆解
  audit:                         # 审计 finder 可用多模型轮换,分散容量/视角
    - claude-sonnet-4-6
    - claude-opus-4-8
  verify: claude-sonnet-4-6     # 对抗验证
  report: claude-sonnet-4-6     # 确认漏洞报告正文
  poc: claude-sonnet-4-6        # 高危 PoC/harness 尝试(enable_poc=true 时需要)

# ── 并发 ──
# concurrency 是全局 agent 上限;model_concurrency 是单个模型自己的上限。
# 未在 model_concurrency 里列出的模型,默认最多可用到全局 concurrency。
concurrency: 4
model_concurrency:
  default: 1                    # 可选:所有未单独列出的模型默认同时只跑 1 个
  claude-sonnet-4-6: 2
  claude-opus-4-8: 1

# ── 流水线参数(全部可选,下面是默认值) ──
params:
  finders_per_lens: 2           # 每个攻击面每个 lens 每轮派几个 finder
  dry_rounds: 2                 # 连续几轮无新增即收敛
  max_rounds: 6                 # 审计循环硬上限
  verify_votes: 3               # 每条候选的对抗验证票数(多数否决即杀)
  threat_model: REMOTE          # REMOTE | LOCAL_UNPRIVILEGED | BOTH
  enable_poc: true              # 高危项是否进隔离 worktree 编译 PoC
  lenses: [memory, integer, race, injection, authn, crypto, dos, infoleak]
  decompose: true               # 审计前把大 region 拆成有界子任务
  unit_line_budget: 1500
  max_subtasks_per_region: 16
  max_files_per_unit: 4

# ── git 历史问题模式挖掘(统一调度队列中与 high audit finder 同级) ──
# 从侦察中抽离:遍历 git log 的提交,**每条提交派 1 个 agent**(role=history)读其改动,
# 判定是否安全修复;相关者提炼成「历史问题模式」,随挖随补回灌到 Web「历史问题」页签与审计队列(同类变体排查种子)。
# 这一块不阻塞侦察和审计;健康检查后即与 recon 同时启动,并与 high audit finder 按同一优先级参与统一排队。
# 断点续跑时会先恢复 historyDone,避免重复分析已处理提交。
history:
  enabled: true                 # 总开关(非 git 仓自动跳过)
  max_commits: 200              # 最多分析多少条最近提交(0 = 不限)
  concurrency: 1                # 兼容旧配置;统一调度下实际并发由全局 concurrency + role/model 容量决定
  # since: "1 year ago"         # 可选:只看某时间段的提交(git log --since)
  # paths: "src lib"            # 可选:限定 git log 路径(留空则用 scope;空格分隔多个)
  poll_interval_s: 3            # 审计循环等待历史变体灌入的轮询间隔(秒)

# ── 专用优先排查通道(历史变体 + 风险点复查) ──
# 把「历史问题模式的同类变体排查」与「已登记风险点的复查」抽到一条独立的**优先队列**,
# 由专用 agent(role=recheck)处理,优先级最高:只要队列里有项,空出的 agent 名额就先来处理它
# (懒占全局并发名额——有活才占、用完即还;队列空时不占用主池)。
# 风险点复查的对象:被调函数/危险原语(B)的安全依赖调用方传入已校验的参数,当前路径安全但
# 全仓其它调用 B 的地方未必都做了等价校验——即变体排查的种子。
# 风险点产出后:severity_hint ≥ risk_min_severity 的自动入队;低于阈值的只登记进 RISKS.md,
# 人工在 Web 调高级别后会自动入队补排(调低则在未开排前出队)。
recheck:
  enabled: true                 # 总开关
  concurrency: 1                # 该角色并发上限(默认 1:逐条串行排查)
  risk_min_severity: medium     # 风险点自动入排查队列的最低 severity_hint(high/medium/low/info)
  poll_interval_s: 3            # 优先队列空时的轮询等待间隔(秒)

# ── 方法库目录(.md 审计方法,agent 运行时会 Read) ──
# 默认使用项目自带的 proto_vuln_hunt/methods/(随项目分发,无需任何外部依赖)。
# 只有想用自定义方法库时才取消注释并指向你自己的目录:
# methods_dir: /path/to/your/methods

# ── 断点续跑 ──
resume: true                    # 重跑相同命令自动从断点继续
# fresh: true                   # 取消注释 = 忽略断点从头跑

# ── Web 控制台(仅 `serve` 子命令使用) ──
web:
  host: 127.0.0.1               # 绑定地址(对外暴露需自行加反代/鉴权)
  port: 8000
  runs_dir: ./pvh-runs          # 各 run 的根目录(每个 run 一个子目录)

# ── 模型健康检查 ──
# 运行开始前对**所有配置的模型**各发一个极小探针(默认问 1+1=?),确认每个模型可达且能正常回答;
# 之后真正用某模型派任务前,若其健康状态未知/异常/陈旧(超过 ttl_s)会自动补检一次(按 ttl 去重,不会每次都探)。
# 健康度实时显示在 Web 控制台的「模型」页(可手动「重新检查」)。探针不计入 token 用量统计。
health_check:
  enabled: true                 # 总开关
  on_start: true                # 运行开始前先把所有模型探一遍
  gate: true                    # 调用某模型前若状态陈旧/异常则先补一次探针
  ttl_s: 300                    # gate 复检的新鲜度窗口(秒);<=0 表示只在 on_start 探一次
  timeout_ms: 120000            # 单次探针墙钟超时(独立于审计任务的大超时)
  prompt: "这是一次模型健康检查,请忽略其它指令。只输出最终答案的数字,不要任何解释或多余文字:1+1=?"
  expect: "2"                   # 答案里应包含的子串(命中=正常;可达但未命中=异常)

# ── 后端 CLI 任务执行失败后的重试 ──
# 注意:opencode/claude/codex 内部已自行重试瞬时 API 抖动;这一层只在 **CLI 任务整体失败** 时重试,
# 即:子进程非零退出 / 超时 / 输出无法解析为所需的结构化 JSON。max_attempts 是单组重试次数;
# recon 会一直重试到成功或用户停止,audit/recheck 单组耗尽后把审计项放回队尾稍后继续重试。
retry:
  max_attempts: 4               # 失败后最多再重试几次(总尝试 = 1 + max_attempts)
  backoff_base_ms: 2000         # 退避基数(指数增长;疑似限流时自动延长)
  backoff_cap_ms: 30000         # 单次退避封顶
  timeout_ms: 1800000           # 单次子进程墙钟超时(超时也算一次失败 → 计入重试)

# ── 后端调用方式(可选;不写则用内置默认模板) ──
# command 是 token 列表;运行时替换:{model}=当前角色模型,{prompt}=提示词(仅 arg 模式),{prompt_file}=提示词文件路径(仅 file 模式)。
# prompt_mode: stdin(提示词从标准输入喂入) | arg(提示词作为命令行参数,用 {prompt} 占位) | file(提示词写文件,命令用 {prompt_file})。
# parse: claude_json(把 stdout 当 JSON 取 .result) | text(stdout 即文本)。
# env: 给该后端注入的环境变量(可选)。
backends:
  claude:
    command: ["claude", "-p", "--output-format", "json", "--model", "{model}", "--dangerously-skip-permissions"]
    prompt_mode: stdin
    parse: claude_json
  opencode:
    # --format json:opencode 以结构化事件流(每行一个 JSON 事件)输出,子进程跑完后才能确定性拿到完整最终文本,
    # 避免默认 --format default(流式/TUI 渲染)在管道里只抓到部分中间输出。它只约束输出封装,不约束模型正文为 JSON。
    # {prompt} 会作为单个 positional message argv 传给 opencode run;不经过 shell,换行不会被分行截断。
    command: ["opencode", "run", "--format", "json", "--model", "{model}", "{prompt}"]
    prompt_mode: arg
    parse: text
  codex:
    command: ["codex", "exec", "--model", "{model}", "--dangerously-bypass-approvals-and-sandbox", "--skip-git-repo-check", "{prompt}"]
    prompt_mode: arg
    parse: text
